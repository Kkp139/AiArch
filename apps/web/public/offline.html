<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0C0C0D" />
  <title>Offline — A&F Design Studio Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0C0C0D;
      color: #E8E8E9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: linear-gradient(180deg, #16191E 0%, #111317 100%);
      border: 1px solid #2B323D;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #1F252E;
      border: 1px solid #3B4452;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .logo-badge svg {
      width: 38px;
      height: 38px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(224, 86, 36, 0.15);
      border: 1px solid rgba(224, 86, 36, 0.35);
      color: #FF7849;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FF7849;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #9DA7B3;
      margin-bottom: 28px;
    }
    .retry-btn {
      background: #BF935A;
      color: #0C0C0D;
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .retry-btn:hover {
      background: #D4A76E;
      transform: translateY(-1px);
    }
    .retry-btn:active {
      transform: translateY(0);
    }
    .studio-footer {
      margin-top: 24px;
      font-size: 12px;
      color: #586069;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="logo-badge">
      <svg viewBox="0 0 70 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24.9945 47.4367C24.9056 47.6573 22.9333 49.6645 22.6312 49.9434C19.7744 52.5734 16.4852 54.1796 12.6466 54.3769C10.1736 54.504 7.26325 53.9954 5.5419 51.9104C3.851 49.8591 3.15418 46.884 4.26642 44.3345C6.69312 38.7735 15.708 37.5539 21.067 37.1167L24.411 36.9221C24.8715 36.8598 25.0737 36.8455 25.0774 37.4242C25.0835 38.4492 25.0871 47.2058 24.9945 47.4367Z" fill="#BF935A"/>
        <path d="M50.9013 19.6593C50.0388 19.6593 44.5994 19.5646 44.2461 19.7021C44.0817 20.1822 44.173 21.5951 44.4264 21.9649C45.0989 22.9406 47.1102 22.5345 48.5306 22.7421L50.9013 22.8212C50.9013 28.918 50.9013 35.0161 50.9013 41.1129C50.9013 44.1619 50.9452 47.2486 50.8989 50.2924C50.8879 51.0035 51.2802 51.2201 51.7309 51.7002L54.9775 55.1268L54.9799 44.8301V22.8212H67.9004V19.6969L50.9013 19.6593Z" fill="#BF935A"/>
      </svg>
    </div>

    <div class="status-pill">
      <span class="status-dot"></span>
      <span>No Internet Connection</span>
    </div>

    <h1>Workspace Offline</h1>
    <p>
      The A&F Design Portal requires an active connection to synchronize CAD drawings, review verifications, and exchange encrypted site communications.
    </p>

    <button class="retry-btn" onclick="checkConnection()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span>Retry Connection</span>
    </button>
  </div>

  <div class="studio-footer">
    A&F Design Studio Collaboration Platform
  </div>

  <script>
    function checkConnection() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        const btn = document.querySelector('.retry-btn span');
        btn.textContent = 'Checking...';
        fetch('/manifest.json', { cache: 'no-store' })
          .then(() => window.location.reload())
          .catch(() => {
            btn.textContent = 'Still Offline — Tap to Retry';
            setTimeout(() => { btn.textContent = 'Retry Connection'; }, 2000);
          });
      }
    }

    // Auto-reload when connection comes back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
