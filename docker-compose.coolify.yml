services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pronex_archai}
      POSTGRES_USER: ${POSTGRES_USER:-pronex_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pronex_admin} -d ${POSTGRES_DB:-pronex_archai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: always
    command: sh -c "node node_modules/prisma/build/index.js db push --schema=apps/api/prisma/schema.prisma --skip-generate && node apps/api/dist/server.js"
    environment:
      NODE_ENV: production
      PORT: 4000
      STUDIO_NAME: ${STUDIO_NAME:-A&F Design}
      STUDIO_DOMAIN: ${STUDIO_DOMAIN:-aandfdesign.sahajai.tech}
      API_URL: ${API_URL:-https://aandfdesign.sahajai.tech/api}
      CLIENT_APP_URL: ${CLIENT_APP_URL:-https://aandfdesign.sahajai.tech}
      DATABASE_URL: postgres://${POSTGRES_USER:-pronex_admin}:${DB_PASSWORD}@db:5432/${POSTGRES_DB:-pronex_archai}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-10}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-cloudflare_r2}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-}
      WHATSAPP_ENABLE_MOCK: ${WHATSAPP_ENABLE_MOCK:-true}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-meta}
      META_WA_PHONE_NUMBER_ID: ${META_WA_PHONE_NUMBER_ID:-}
      META_WA_BUSINESS_ACCOUNT_ID: ${META_WA_BUSINESS_ACCOUNT_ID:-}
      META_WA_ACCESS_TOKEN: ${META_WA_ACCESS_TOKEN:-}
      META_WA_TEMPLATE_NAME: ${META_WA_TEMPLATE_NAME:-pronex_login_otp}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@afdesign.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-A&F Design <onboarding@resend.dev>}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-A&F Design <onboarding@resend.dev>}
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-pronex_admin}:${DB_PASSWORD}@db:5432/${POSTGRES_DB:-pronex_archai}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: always
    expose:
      - "80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
