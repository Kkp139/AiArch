version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pronex_db
    restart: always
    environment:
      POSTGRES_DB: pronex_archai
      POSTGRES_USER: pronex_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pronex_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pronex_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: pronex_api
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgres://pronex_admin:${DB_PASSWORD:-pronex_secret_password}@db:5432/pronex_archai
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-pronex_dev_jwt_secret_key_12345}
    ports:
      - "4000:4000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: pronex_worker
    restart: always
    environment:
      DATABASE_URL: postgres://pronex_admin:${DB_PASSWORD:-pronex_secret_password}@db:5432/pronex_archai
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: pronex_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
